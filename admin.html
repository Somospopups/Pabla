<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Panel profesional · Od. Pabla Bonaudi</title>
<meta name="robots" content="noindex, nofollow" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='48' fill='%235e1224'/><text x='50' y='68' font-size='42' text-anchor='middle' fill='%23e4c87a' font-family='Georgia' font-style='italic'>PB</text></svg>" />
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,400&family=Jost:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
:root{
  --bordo:#5e1224; --bordo-2:#7a1f35; --bordo-3:#93314d; --vino:#3f0b1a;
  --crema:#faf5f0; --nude:#f3e8e1; --nude-2:#e9d9cf; --dorado:#c9a24b; --dorado-suave:#e4c87a;
  --texto:#40222b; --texto-suave:#83626d; --blanco:#fffdfb;
  --verde:#1d5c46; --ambar:#d97706; --rojo:#b3261e;
  --font-display:'Playfair Display', Georgia, serif; --font-body:'Jost', system-ui, sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--font-body);background:var(--crema);color:var(--texto);min-height:100vh}
.topbar{background:var(--vino);color:#fdf3ec;padding:.9rem 1.5rem;display:flex;justify-content:space-between;align-items:center;gap:1rem;flex-wrap:wrap}
.topbar .brand{display:flex;align-items:center;gap:.7rem;text-decoration:none;color:inherit}
.monogram{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-family:var(--font-display);font-style:italic;color:var(--dorado-suave);background:radial-gradient(circle at 35% 30%, var(--bordo-3), var(--bordo) 70%);border:1.5px solid var(--dorado)}
.topbar small{display:block;font-size:.62rem;letter-spacing:.16em;text-transform:uppercase;color:rgba(253,243,236,.6)}
.topbar strong{font-size:.92rem}
.topbar-actions{display:flex;gap:.6rem;align-items:center}
.btn{display:inline-flex;align-items:center;gap:.45rem;border:none;border-radius:999px;cursor:pointer;font-family:var(--font-body);font-weight:600;font-size:.85rem;padding:.6rem 1.2rem;text-decoration:none;transition:transform .2s, filter .2s}
.btn:hover{filter:brightness(1.08);transform:translateY(-1px)}
.btn-gold{background:linear-gradient(160deg,var(--dorado-suave),var(--dorado));color:#3d2c07}
.btn-ghost{background:transparent;color:#fdf3ec;border:1px solid rgba(253,243,236,.35)}
.btn-bordo{background:var(--bordo);color:#fff}
.btn-verde{background:var(--verde);color:#062f16}
.btn-rojo{background:var(--rojo);color:#fff}
.btn-sm{padding:.4rem .8rem;font-size:.78rem}

/* ---------- Login ---------- */
.login-wrap{min-height:calc(100vh - 66px);display:grid;place-items:center;padding:2rem}
.login-card{background:var(--blanco);border-radius:20px;box-shadow:0 24px 60px rgba(63,11,26,.25);border:1px solid rgba(201,162,75,.4);padding:2.5rem 2rem;width:min(420px,100%);text-align:center}
.login-card h1{font-family:var(--font-display);color:var(--vino);font-size:1.5rem;margin:.8rem 0 .2rem}
.login-card p{color:var(--texto-suave);font-size:.88rem;margin-bottom:1.5rem}
.login-card input{width:100%;padding:.85rem 1rem;border-radius:12px;border:1.5px solid var(--nude-2);font-family:var(--font-body);font-size:1rem;outline:none;margin-bottom:.8rem;background:var(--crema)}
.login-card input:focus{border-color:var(--bordo-3);box-shadow:0 0 0 3px rgba(147,49,77,.15)}
.login-error{color:var(--rojo);font-size:.85rem;min-height:1.3em;margin-bottom:.4rem;font-weight:500}
.back-link{display:inline-block;margin-top:1rem;font-size:.82rem;color:var(--texto-suave);text-decoration:none}
.back-link:hover{color:var(--bordo)}

/* ---------- Dashboard ---------- */
.dashboard{display:none;padding:1.5rem;max-width:1200px;margin:0 auto}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:.9rem;margin-bottom:1.4rem}
.stat{background:var(--blanco);border:1px solid var(--nude-2);border-radius:16px;padding:1rem 1.1rem;box-shadow:0 2px 10px rgba(63,11,26,.07)}
.stat small{font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;color:var(--texto-suave);display:block}
.stat strong{font-family:var(--font-display);font-size:1.9rem;color:var(--vino);display:block;line-height:1.2}
.stat.accent{background:var(--vino);border-color:var(--bordo)}
.stat.accent small{color:rgba(253,243,236,.6)}
.stat.accent strong{color:var(--dorado-suave)}
.panel{background:var(--blanco);border:1px solid var(--nude-2);border-radius:18px;box-shadow:0 6px 24px rgba(63,11,26,.08);overflow:hidden}
.panel-head{display:flex;justify-content:space-between;align-items:center;gap:1rem;flex-wrap:wrap;padding:1.1rem 1.3rem;border-bottom:1px solid var(--nude)}
.panel-head h2{font-family:var(--font-display);color:var(--vino);font-size:1.15rem}
.filters{display:flex;gap:.4rem;flex-wrap:wrap;padding:.9rem 1.3rem;border-bottom:1px solid var(--nude);background:var(--crema)}
.filter-btn{border:1.5px solid var(--nude-2);background:var(--blanco);border-radius:999px;padding:.38rem .95rem;font-size:.8rem;font-weight:600;color:var(--texto-suave);cursor:pointer;font-family:var(--font-body);transition:all .2s}
.filter-btn:hover{border-color:var(--bordo-3);color:var(--bordo)}
.filter-btn.active{background:var(--bordo);border-color:var(--bordo);color:#fff}
.search-row{padding:.9rem 1.3rem;border-bottom:1px solid var(--nude)}
.search-row input{width:100%;padding:.7rem .95rem;border-radius:12px;border:1.5px solid var(--nude-2);outline:none;font-family:var(--font-body);background:var(--crema)}
.search-row input:focus{border-color:var(--bordo-3)}
.appointments{display:flex;flex-direction:column}
.day-group{padding:.8rem 1.3rem .3rem;font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--dorado);font-weight:700;background:linear-gradient(180deg, var(--nude), transparent)}
.appt{display:grid;grid-template-columns:70px 1.4fr 1.6fr auto;gap:1rem;align-items:center;padding:.85rem 1.3rem;border-bottom:1px solid var(--nude)}
.appt:last-child{border-bottom:none}
.appt-time{font-family:var(--font-display);font-size:1.15rem;color:var(--vino);font-weight:700}
.appt-time small{display:block;font-size:.62rem;font-family:var(--font-body);color:var(--texto-suave);letter-spacing:.06em}
.appt-name{font-weight:600;color:var(--vino)}
.appt-name a{color:inherit;text-decoration:none;font-size:.82rem;color:var(--texto-suave);display:flex;align-items:center;gap:.3rem}
.appt-name a:hover{color:var(--bordo-2)}
.appt-treatment{font-size:.88rem;color:var(--texto)}
.appt-treatment small{display:block;color:var(--texto-suave);font-size:.74rem}
.appt-notes{font-size:.78rem;color:var(--texto-suave);font-style:italic;margin-top:.15rem}
.appt-actions{display:flex;flex-direction:column;gap:.35rem;align-items:flex-end}
.badge{font-size:.68rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;border-radius:999px;padding:.25rem .75rem}
.badge-pendiente{background:#fef3c7;color:#92400e}
.badge-confirmado{background:#dcfce7;color:#166534}
.badge-cancelado{background:#fee2e2;color:#b91c1c}
.appt-buttons{display:flex;gap:.35rem}
.empty{text-align:center;padding:3rem 1rem;color:var(--texto-suave)}
.loading{text-align:center;padding:2rem;color:var(--texto-suave)}
@media (max-width:820px){
  .stats{grid-template-columns:repeat(2,1fr)}
  .appt{grid-template-columns:1fr;gap:.35rem;padding:.9rem 1.1rem}
  .appt-actions{flex-direction:row;align-items:center;justify-content:space-between;width:100%}
}
</style>
</head>
<body>

<header class="topbar">
  <a class="brand" href="index.html">
    <span class="monogram">PB</span>
    <span><strong>Od. Pabla Bonaudi</strong><small>Panel profesional · Turnos</small></span>
  </a>
  <div class="topbar-actions" id="topbarActions" hidden>
    <button class="btn btn-gold btn-sm" id="exportCsvBtn">⬇ Exportar CSV</button>
    <button class="btn btn-ghost btn-sm" id="logoutBtn">Cerrar sesión</button>
  </div>
</header>

<!-- ════════ LOGIN ════════ -->
<div class="login-wrap" id="loginWrap">
  <form class="login-card" id="loginForm">
    <div class="monogram" style="margin:0 auto">PB</div>
    <h1>Acceso profesional</h1>
    <p>Ingresá tu contraseña para ver y gestionar los turnos.</p>
    <input type="password" id="passwordInput" placeholder="Contraseña" autocomplete="current-password" required />
    <div class="login-error" id="loginError" role="alert"></div>
    <button type="submit" class="btn btn-bordo" style="width:100%;justify-content:center;padding:.85rem">Entrar al panel</button>
    <a class="back-link" href="index.html">← Volver al sitio</a>
  </form>
</div>

<!-- ════════ DASHBOARD ════════ -->
<main class="dashboard" id="dashboard">
  <div class="stats">
    <div class="stat accent"><small>Turnos hoy</small><strong id="statToday">0</strong></div>
    <div class="stat"><small>Pendientes de confirmar</small><strong id="statPending">0</strong></div>
    <div class="stat"><small>Confirmados (próximos)</small><strong id="statConfirmed">0</strong></div>
    <div class="stat"><small>Total registrados</small><strong id="statTotal">0</strong></div>
  </div>

  <div class="panel">
    <div class="panel-head">
      <h2>Agenda de turnos</h2>
      <button class="btn btn-bordo btn-sm" id="refreshBtn">↻ Actualizar</button>
    </div>
    <div class="filters" id="filters">
      <button class="filter-btn active" data-filter="all">Todos</button>
      <button class="filter-btn" data-filter="today">Hoy</button>
      <button class="filter-btn" data-filter="pendiente">Pendientes</button>
      <button class="filter-btn" data-filter="confirmado">Confirmados</button>
      <button class="filter-btn" data-filter="cancelado">Cancelados</button>
    </div>
    <div class="search-row">
      <input type="text" id="searchInput" placeholder="Buscar por nombre, teléfono o tratamiento…" />
    </div>
    <div class="appointments" id="appointmentsList"><div class="loading">Cargando turnos…</div></div>
  </div>
</main>

<script>
'use strict';
const WA = '5493512166540';
const $ = (s) => document.querySelector(s);
const $$ = (s) => [...document.querySelectorAll(s)];
let token = sessionStorage.getItem('pb_admin_token') || null;
let appointments = [];
let currentFilter = 'all';
let searchTerm = '';

const loginWrap = $('#loginWrap'), dashboard = $('#dashboard'), topbarActions = $('#topbarActions');

function showDashboard() {
  loginWrap.style.display = 'none';
  dashboard.style.display = 'block';
  topbarActions.hidden = false;
  loadAppointments();
}
function showLogin() {
  loginWrap.style.display = 'grid';
  dashboard.style.display = 'none';
  topbarActions.hidden = true;
}

/* ---------- Login ---------- */
$('#loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const err = $('#loginError'); err.textContent = '';
  const password = $('#passwordInput').value;
  try {
    const res = await fetch('/api/admin/login', {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ password })
    });
    const data = await res.json();
    if (!res.ok) { err.textContent = data.error || 'Contraseña incorrecta.'; return; }
    token = data.token;
    sessionStorage.setItem('pb_admin_token', token);
    showDashboard();
  } catch { err.textContent = 'Error de conexión.'; }
});

$('#logoutBtn').addEventListener('click', () => { sessionStorage.removeItem('pb_admin_token'); token = null; showLogin(); });
$('#refreshBtn').addEventListener('click', loadAppointments);

/* ---------- Cargar turnos ---------- */
async function loadAppointments() {
  const list = $('#appointmentsList');
  list.innerHTML = '<div class="loading">Cargando turnos…</div>';
  try {
    const res = await fetch('/api/admin/appointments', { headers: { 'x-admin-token': token } });
    if (res.status === 401) { sessionStorage.removeItem('pb_admin_token'); token = null; showLogin(); return; }
    const data = await res.json();
    appointments = data.appointments || [];
    renderStats();
    renderList();
  } catch { list.innerHTML = '<div class="empty">Error de conexión. Probá actualizar.</div>'; }
}

function todayISO() {
  const n = new Date(); const off = n.getTimezoneOffset();
  return new Date(n.getTime() - off * 60000).toISOString().slice(0, 10);
}
const prettyDate = (iso) => new Date(iso + 'T12:00:00').toLocaleDateString('es-AR', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function renderStats() {
  const t = todayISO();
  $('#statToday').textContent = appointments.filter(a => a.date === t && a.status !== 'cancelado').length;
  $('#statPending').textContent = appointments.filter(a => a.status === 'pendiente').length;
  $('#statConfirmed').textContent = appointments.filter(a => a.status === 'confirmado' && a.date >= t).length;
  $('#statTotal').textContent = appointments.length;
}

function matchesFilter(a) {
  const t = todayISO();
  if (currentFilter === 'today') return a.date === t;
  if (currentFilter === 'all') return true;
  return a.status === currentFilter;
}
function matchesSearch(a) {
  if (!searchTerm) return true;
  const hay = `${a.name} ${a.phone} ${a.treatment} ${a.area} ${a.notes || ''}`.toLowerCase();
  return hay.includes(searchTerm);
}

function renderList() {
  const list = $('#appointmentsList');
  const filtered = appointments.filter(a => matchesFilter(a) && matchesSearch(a));
  if (!filtered.length) { list.innerHTML = '<div class="empty">No hay turnos para mostrar con este filtro.</div>'; return; }

  let html = '', lastDate = null;
  for (const a of filtered) {
    if (a.date !== lastDate) { html += `<div class="day-group">${esc(prettyDate(a.date))}</div>`; lastDate = a.date; }
    const digits = a.phone.replace(/\D/g, '');
    const waNum = digits.startsWith('54') ? digits : '549' + digits.replace(/^0/, '').replace(/^15/, '');
    const waLink = `https://wa.me/${waNum}?text=${encodeURIComponent(`Hola ${a.name.split(' ')[0]}! Te escribo por tu turno del ${a.date.split('-').reverse().join('/')} a las ${a.time} hs (${a.treatment}).`)}`;
    html += `
    <div class="appt" data-id="${esc(a.id)}">
      <div class="appt-time">${esc(a.time)}<small>${a.area === 'odontologia' ? 'Odonto' : 'Armonización'}</small></div>
      <div class="appt-name">${esc(a.name)}
        <a href="${esc(waLink)}" target="_blank" rel="noopener">📱 ${esc(a.phone)}</a>
      </div>
      <div class="appt-treatment">${esc(a.treatment)}${a.notes ? `<div class="appt-notes">“${esc(a.notes)}”</div>` : ''}</div>
      <div class="appt-actions">
        <span class="badge badge-${esc(a.status)}">${esc(a.status)}</span>
        <div class="appt-buttons">
          ${a.status !== 'confirmado' ? `<button class="btn btn-verde btn-sm" data-action="confirmado">✓ Confirmar</button>` : ''}
          ${a.status !== 'cancelado' ? `<button class="btn btn-rojo btn-sm" data-action="cancelado">✕ Cancelar</button>` : `<button class="btn btn-bordo btn-sm" data-action="pendiente">↺ Reactivar</button>`}
          <button class="btn btn-ghost btn-sm" data-action="delete" style="color:var(--rojo);border-color:#f3c0c0;background:#fff">🗑</button>
        </div>
      </div>
    </div>`;
  }
  list.innerHTML = html;
}

$('#filters').addEventListener('click', (e) => {
  const btn = e.target.closest('.filter-btn'); if (!btn) return;
  currentFilter = btn.dataset.filter;
  $$('.filter-btn').forEach(b => b.classList.toggle('active', b === btn));
  renderList();
});
$('#searchInput').addEventListener('input', (e) => { searchTerm = e.target.value.trim().toLowerCase(); renderList(); });

/* ---------- Acciones sobre turnos ---------- */
$('#appointmentsList').addEventListener('click', async (e) => {
  const btn = e.target.closest('button[data-action]'); if (!btn) return;
  const row = btn.closest('.appt'); const id = row?.dataset.id; const action = btn.dataset.action;
  if (!id) return;

  if (action === 'delete') {
    if (!confirm('¿Eliminar este turno definitivamente?')) return;
    await fetch(`/api/admin/appointments/${id}`, { method: 'DELETE', headers: { 'x-admin-token': token } });
  } else {
    await fetch(`/api/admin/appointments/${id}`, {
      method: 'PATCH', headers: { 'Content-Type': 'application/json', 'x-admin-token': token },
      body: JSON.stringify({ status: action }),
    });
  }
  loadAppointments();
});

/* ---------- Exportar CSV ---------- */
$('#exportCsvBtn').addEventListener('click', () => {
  const header = ['Fecha', 'Horario', 'Paciente', 'Teléfono', 'Área', 'Tratamiento', 'Estado', 'Nota', 'Creado'];
  const rows = appointments.map(a => [a.date, a.time, a.name, a.phone, a.area === 'odontologia' ? 'Odontología' : 'Armonización Orofacial', a.treatment, a.status, (a.notes || '').replace(/[\n;]+/g, ' '), a.createdAt || '']);
  const csv = [header, ...rows].map(r => r.map(c => `"${String(c).replace(/"/g, '""')}"`).join(';')).join('\r\n');
  const blob = new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'turnos-pabla-bonaudi.csv'; a.click();
  URL.revokeObjectURL(url);
});

/* ---------- Arranque ---------- */
if (token) showDashboard(); else showLogin();
</script>
</body>
</html>
